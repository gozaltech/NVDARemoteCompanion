build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 9
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 20
    thresholdInObjects: 30
    ignoreAnnotatedFunctions: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 100
  ReturnCount:
    max: 5
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
